name: Build living rest-state regions

on:
  workflow_dispatch:
  push:
    branches:
      - portfolio-world-base
    paths:
      - scripts/build-rest-ambient.py
      - .github/workflows/build-rest-ambient.yml

permissions:
  contents: write

jobs:
  build-ambient:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout portfolio world branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-world-base

      - name: Install media and vision tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-opencv python3-numpy

      - name: Build stabilized real-pixel rest-state loops
        run: python3 scripts/build-rest-ambient.py

      - name: Verify generated living regions
        shell: bash
        run: |
          set -euo pipefail
          test -s public/portfolio-world/ambient/01-river.mp4
          test -s public/portfolio-world/ambient/03-threshold-river.mp4
          test -s public/portfolio-world/ambient/04-study-river.mp4
          test -s public/portfolio-world/ambient/05-passage-stream.mp4
          test -s public/portfolio-world/ambient/06-studio-foliage.mp4
          test -s public/portfolio-world/ambient/06-studio-river.mp4
          test -s public/portfolio-world/ambient/07-archive-river.mp4
          test -s public/portfolio-world/ambient/08-reflection-river.mp4
          test -s public/portfolio-world/ambient/10-fountain-pool.mp4
          python3 -m json.tool public/portfolio-world/ambient/manifest.json >/dev/null
          find public/portfolio-world/ambient -type f -maxdepth 1 -printf '%f %k KB\n' | sort

      - name: Commit generated rest-state assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/portfolio-world/ambient
          if git diff --cached --quiet; then
            echo "Living regions are already current"
            exit 0
          fi
          git commit -m "assets: expand living rest-state motion"
          git push origin HEAD:portfolio-world-base
