name: Connected Portfolio Validation

on:
  push:
    branches:
      - portfolio-redesign
      - portfolio-v1-2d-depth
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build portfolio
        run: npm run build

      - name: Run portfolio browser checks
        shell: bash
        run: |
          if [[ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" == portfolio-v1-* ]]; then
            npm run test:v1
          else
            npm run test:redesign
          fi

      - name: Upload portfolio scene captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-portfolio-scenes
          path: |
            test-results/*.png
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
