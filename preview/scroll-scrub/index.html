<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Scroll-Scrub Preview</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0a0d0b;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}.hud{position:fixed;z-index:50;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:18px 24px;background:linear-gradient(#080b09cc,transparent);font-size:12px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}.rest{position:relative;height:100svh;min-height:620px;overflow:hidden}.rest img,.motion video,.motion img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.rest:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),transparent 58%),linear-gradient(to top,rgba(0,0,0,.45),transparent 45%)}.copy{position:absolute;z-index:3;left:8vw;top:50%;transform:translateY(-50%);width:min(560px,44vw);text-shadow:0 2px 25px #000}.copy .n{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.7}.copy h1{font:400 clamp(42px,6vw,92px)/.96 Georgia,serif;margin:14px 0 18px;letter-spacing:-.04em}.copy p{font-size:17px;line-height:1.5;max-width:45ch;color:#fffde9d9}.rest.right .copy{left:auto;right:8vw;text-align:right}.hint{position:absolute;z-index:3;left:24px;right:24px;bottom:22px;display:flex;gap:12px;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}.hint i{height:1px;background:#ffffff55;flex:1}.motion{position:relative;height:230svh;background:#090c0a}.motion .sticky{position:sticky;top:0;height:100svh;overflow:hidden;background:#090c0a}.motion video{z-index:2;opacity:0;transition:opacity .15s linear}.motion video.ready{opacity:1}.motion .fallback.a{z-index:1}.motion .fallback.b{z-index:2;opacity:0}.motion .label{position:absolute;z-index:5;left:24px;right:24px;bottom:22px;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 15px #000}.motion .label i{height:1px;background:#ffffff55}.motion .label em{font-style:normal;opacity:.55}.motion:after{content:"";position:absolute;inset:0;pointer-events:none}.rest.flash{animation:restIn .25s ease both}@keyframes restIn{from{opacity:.92}to{opacity:1}}@media(max-width:800px){.copy,.rest.right .copy{left:20px;right:20px;top:auto;bottom:74px;width:auto;transform:none;text-align:left}.copy h1{font-size:clamp(38px,12vw,64px)}.copy p{font-size:15px}.motion{height:190svh}.motion .label{grid-template-columns:auto 1fr auto}.motion .label em{display:none}}</style></head><body><div class="hud"><span>Ankit Bhardwaj · motion base</span><span id="counter">01 / 10</span></div><div id="app"></div><script>const B='https://raw.githubusercontent.com/Ankit6149/portfolio/portfolio-world-base/';const frames=[['PORTFOLIO_F01_ARRIVAL.png','Arrival','Ankit Bhardwaj','Software, research, systems — inside one living world.'],['PORTFOLIO_F02_APPROACH.png','Approach','Curiosity came first.','The scene rests on a clean still; scrolling moves the camera.'],['PORTFOLIO_F03_THRESHOLD.png','Threshold','Enter the work slowly.','The transition itself is the video, controlled by scroll position.'],['PORTFOLIO_F04_ENTER_ESTATE.png','Estate','Observation becomes structure.','Stop at the section and the high-quality image is what remains.'],['PORTFOLIO_F05_INTERIOR_DISCOVERY.png','Natural archive','Biology → signals → engineering.','The moving clip only bridges one place to the next.'],['PORTFOLIO_F06_DEEPER_INSIDE.png','Library','Research and evidence.','Scroll backward and the transition rewinds with you.'],['PORTFOLIO_F07_CREATION_SPACE.png','Creation space','Things built, rebuilt, and refined.','The studio becomes a stable section after the motion ends.'],['PORTFOLIO_F08_REFLECTION_SPACE.png','Reflection','Clarity before complexity.','This is the behavior layer before object interactions.'],['PORTFOLIO_F09_RETURN_TO_NATURE.png','Beyond the desk','A person is larger than the work.','Two missing motion bridges temporarily crossfade.'],['PORTFOLIO_F10_CLOSING_WORLD.png','Open horizon','The world stays open.','Final clean still.']];const vids=['stone-balcony-enter.mp4','study-window.mp4','rustic-study-track.mp4','ancient-library-reverse.mp4','library-dolly.mp4','art-studio-enter.mp4','art-studio-glide.mp4',null,null];const app=document.getElementById('app');const img=i=>B+'portfolio-assets/'+frames[i][0];const video=n=>B+'public/portfolio-world/videos/'+n;frames.forEach((s,i)=>{const rest=document.createElement('section');rest.className='rest '+(i%2?'right':'');rest.dataset.scene=i;rest.innerHTML=`<img src="${img(i)}"><div class="copy"><div class="n">${String(i+1).padStart(2,'0')} · ${s[1]}</div><h1>${s[2]}</h1><p>${s[3]}</p></div><div class="hint"><span>pause = clean image</span><i></i><span>scroll = movement</span></div>`;app.appendChild(rest);if(i<9){const m=document.createElement('section');m.className='motion';m.dataset.from=i;m.dataset.to=i+1;if(vids[i])m.innerHTML=`<div class="sticky"><img class="fallback a" src="${img(i)}"><video muted playsinline preload="metadata" src="${video(vids[i])}"></video><div class="label"><span>${String(i+1).padStart(2,'0')}</span><i></i><strong>${String(i+2).padStart(2,'0')}</strong><em>scroll = playback</em></div></div>`;else m.innerHTML=`<div class="sticky"><img class="fallback a" src="${img(i)}"><img class="fallback b" src="${img(i+1)}"><div class="label"><span>${String(i+1).padStart(2,'0')}</span><i></i><strong>${String(i+2).padStart(2,'0')}</strong><em>temporary crossfade</em></div></div>`;app.appendChild(m)}});const motions=[...document.querySelectorAll('.motion')];motions.forEach(m=>{const v=m.querySelector('video');if(v)v.addEventListener('loadedmetadata',()=>{try{v.currentTime=.001}catch{}v.classList.add('ready')})});let ticking=false;function update(){ticking=false;const vh=innerHeight;let active=0;document.querySelectorAll('.rest').forEach((r,i)=>{const q=r.getBoundingClientRect();if(q.top<vh*.55&&q.bottom>vh*.45)active=i});motions.forEach(m=>{const r=m.getBoundingClientRect();const span=Math.max(1,m.offsetHeight-vh);const p=Math.min(1,Math.max(0,-r.top/span));const v=m.querySelector('video');if(v&&Number.isFinite(v.duration)&&v.duration>0){const d=Math.max(0,v.duration-.04);const t=d*p;if(Math.abs(v.currentTime-t)>.02){try{v.currentTime=t}catch{}}}else{const b=m.querySelector('.fallback.b');if(b)b.style.opacity=p}if(r.top<=0&&r.bottom>=vh)active=p>.58?+m.dataset.to:+m.dataset.from});document.getElementById('counter').textContent=String(active+1).padStart(2,'0')+' / 10'}addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(update)}},{passive:true});addEventListener('resize',update);update();</script></body></html>
