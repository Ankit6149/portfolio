<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuous Portfolio Motion Preview</title><style>*{box-sizing:border-box}html,body{margin:0;background:#090c0a;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}.world{height:860svh;background:#090c0a}.stage{position:sticky;top:0;height:100svh;min-height:620px;overflow:hidden;background:#090c0a;isolation:isolate}.videos,.video,.veil,.poster{position:absolute;inset:0}.poster,.video{width:100%;height:100%;object-fit:cover}.poster{z-index:0;transition:opacity .3s ease}.videos{z-index:1}.video{opacity:0;transform:translateZ(0) scale(1.003);will-change:opacity}.veil{z-index:30;pointer-events:none;background:linear-gradient(to bottom,rgba(5,8,6,.22),transparent 18%,transparent 74%,rgba(5,8,6,.3)),radial-gradient(circle at 50% 42%,transparent 44%,rgba(5,8,6,.12))}.hud{position:absolute;z-index:50;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:20px 26px;color:#fffdf0d9;font-size:10px;letter-spacing:.15em;text-transform:uppercase;text-shadow:0 2px 16px #0008;pointer-events:none}.intro{position:absolute;z-index:45;left:7vw;bottom:10vh;width:min(620px,52vw);text-shadow:0 3px 28px #0009;pointer-events:none}.intro p{margin:0 0 12px;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#fffde9b8}.intro h1{margin:0;font:400 clamp(42px,6vw,94px)/.95 Georgia,serif;letter-spacing:-.045em}.intro span{display:block;margin-top:18px;max-width:44ch;font-size:16px;line-height:1.55;color:#fffde9bd}.progress{position:absolute;z-index:50;left:26px;right:26px;bottom:22px;height:1px;background:#ffffff2c;overflow:hidden}.progress i{display:block;width:100%;height:100%;background:#fffde9c4;transform:scaleX(.01);transform-origin:left}.ready .poster{opacity:0}@media(max-width:800px){.world{height:720svh}.stage{min-height:560px}.hud{padding:18px}.intro{left:20px;right:20px;bottom:70px;width:auto}.intro h1{font-size:clamp(38px,12vw,64px);max-width:12ch}.intro span{font-size:14px}.progress{left:18px;right:18px;bottom:18px}}</style></head><body><main class="world" id="world"><section class="stage" id="stage"><img class="poster" src="https://raw.githubusercontent.com/Ankit6149/portfolio/portfolio-world-base/portfolio-assets/PORTFOLIO_F01_ARRIVAL.png"><div class="videos" id="videos"></div><div class="veil"></div><header class="hud"><span>Ankit Bhardwaj</span><span id="label">World</span></header><div class="intro"><p>Scroll is the camera</p><h1>One continuous world.</h1><span>No pages, no chapter stops. Scrolling moves one uninterrupted film forward or backward.</span></div><div class="progress"><i id="bar"></i></div></section></main><script>const B='https://raw.githubusercontent.com/Ankit6149/portfolio/portfolio-world-base/public/portfolio-world/videos/';const clips=[['stone-balcony-enter.mp4','Balcony'],['study-window.mp4','Study'],['ancient-library-reverse.mp4','Archive'],['rustic-study-track.mp4','Passage'],['art-studio-enter.mp4','Studio'],['art-studio-glide.mp4','Creation'],['library-dolly.mp4','Library']];const O=.085;const world=document.getElementById('world'),stage=document.getElementById('stage'),box=document.getElementById('videos'),bar=document.getElementById('bar'),label=document.getElementById('label');const vids=clips.map((c,i)=>{const v=document.createElement('video');v.className='video';v.src=B+c[0];v.muted=true;v.playsInline=true;v.preload=i<3?'auto':'metadata';box.appendChild(v);v.addEventListener('loadedmetadata',()=>{try{v.currentTime=.001}catch{}stage.classList.add('ready')});return v});let target=0,shown=0,ticking=false;function render(p){const total=clips.length-(clips.length-1)*O,head=Math.max(0,Math.min(total,p*total));let best=0,bestO=-1;vids.forEach((v,i)=>{const start=i*(1-O),local=head-start;if(local<0||local>1){v.style.opacity=0;return}let op=1;if(i>0&&local<O)op=local/O;if(i<vids.length-1&&local>1-O)op=Math.min(op,(1-local)/O);if(Number.isFinite(v.duration)&&v.duration>0){const t=Math.max(0,Math.min(v.duration-.035,v.duration*local));if(Math.abs(v.currentTime-t)>.014){try{v.currentTime=t}catch{}}}v.style.opacity=Math.max(0,Math.min(1,op));v.style.zIndex=2+i;if(op>bestO){bestO=op;best=i}});label.textContent=clips[best][1];bar.style.transform=`scaleX(${Math.max(.01,p)})`}function frame(){shown+= (target-shown)*.19;if(Math.abs(target-shown)<.00008)shown=target;render(shown);requestAnimationFrame(frame)}function updateTarget(){const max=Math.max(1,world.offsetHeight-innerHeight);const r=world.getBoundingClientRect();target=Math.max(0,Math.min(1,-r.top/max));ticking=false}addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(updateTarget)}},{passive:true});addEventListener('resize',updateTarget);updateTarget();frame();</script></body></html>
